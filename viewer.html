<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 Visualizador de Material de Estudo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ============= HEADER ============= */
        
        .header {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .header h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        /* ============= UPLOAD SECTION ============= */
        
        .upload-section {
            background: white;
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .upload-box {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
        }

        .upload-box:hover {
            background: #f0f2ff;
            border-color: #764ba2;
        }

        .upload-box.dragover {
            background: #e8ebff;
            border-color: #5a67d8;
        }

        #fileInput {
            display: none;
        }

        .upload-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .upload-text {
            color: #667eea;
            font-size: 1.2em;
            font-weight: 600;
        }

        .upload-hint {
            color: #999;
            margin-top: 10px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
            margin: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        /* ============= STATS ============= */
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .stat-number {
            font-size: 3em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #666;
            margin-top: 10px;
            font-size: 1.1em;
        }

        /* ============= TABS ============= */
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab {
            flex: 1;
            background: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #666;
        }

        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* ============= FLASHCARDS ============= */
        
        .flashcards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
            padding: 20px 0;
        }

        .flashcard-container {
            perspective: 1000px;
            height: 280px;
        }

        .flashcard {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .flashcard-front,
        .flashcard-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .flashcard-front {
            background-color: #B3E5FC; /* Azul bebé */
            color: #000000;
        }

        .flashcard-back {
            background-color: #81D4FA; /* Azul bebé mais escuro */
            color: #000000;
            transform: rotateY(180deg);
        }

        .flashcard-front h3 {
            font-size: 1.5em;
            margin: 0;
            line-height: 1.4;
        }

        .flashcard-back p {
            font-size: 1.1em;
            margin: 0;
            line-height: 1.6;
        }

        .difficulty-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
            text-transform: uppercase;
        }

        .difficulty-easy {
            background-color: #4CAF50;
            color: white;
        }

        .difficulty-medium {
            background-color: #FF9800;
            color: white;
        }

        .difficulty-hard {
            background-color: #F44336;
            color: white;
        }

        .tags {
            position: absolute;
            bottom: 15px;
            left: 15px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tag {
            background-color: rgba(0, 0, 0, 0.15);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.85em;
        }

        .flip-hint {
            position: absolute;
            bottom: 15px;
            right: 15px;
            font-size: 0.85em;
            opacity: 0.7;
            font-style: italic;
        }

        /* ============= QUIZ ============= */
        
        .quiz-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 3px solid #f0f0f0;
        }

        .question-number {
            font-size: 1.2em;
            color: #667eea;
            font-weight: 600;
        }

        .question-difficulty {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
        }

        .question-text {
            font-size: 1.4em;
            color: #333;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .options {
            display: grid;
            gap: 15px;
            margin-bottom: 25px;
        }

        .option {
            background: #f8f9ff;
            border: 3px solid transparent;
            padding: 20px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .option:hover {
            background: #e8ebff;
            border-color: #667eea;
        }

        .option.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .option.correct {
            background: #4CAF50;
            color: white;
            border-color: #4CAF50;
        }

        .option.wrong {
            background: #F44336;
            color: white;
            border-color: #F44336;
        }

        .option-letter {
            background: white;
            color: #667eea;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2em;
            flex-shrink: 0;
        }

        .option.selected .option-letter,
        .option.correct .option-letter,
        .option.wrong .option-letter {
            background: rgba(255, 255, 255, 0.3);
            color: white;
        }

        .option-text {
            flex: 1;
            font-size: 1.1em;
        }

        .explanation {
            background: #f0f7ff;
            border-left: 5px solid #667eea;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }

        .explanation.show {
            display: block;
        }

        .explanation-title {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .explanation-text {
            color: #555;
            line-height: 1.6;
        }

        .quiz-nav {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            gap: 15px;
        }

        .quiz-progress {
            text-align: center;
            color: #666;
            font-size: 1.1em;
            margin-top: 20px;
        }

        .progress-bar {
            background: #e0e0e0;
            border-radius: 10px;
            height: 10px;
            margin-top: 10px;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100%;
            transition: width 0.3s ease;
        }

        /* ============= RESULTS ============= */
        
        .results {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .results h2 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 30px;
        }

        .score-circle {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.4);
        }

        .score-number {
            color: white;
            font-size: 4em;
            font-weight: bold;
        }

        .hidden {
            display: none;
        }

        /* ============= CONTROLS ============= */
        
        .controls {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .filter-btn {
            padding: 10px 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: #667eea;
            color: white;
        }

        /* ============= RESPONSIVE ============= */
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }

            .flashcards-grid {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* ============= ANIMATIONS ============= */
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeIn 0.5s ease;
        }

    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header fade-in">
            <h1>📚 Visualizador de Material de Estudo</h1>
            <p>Visualiza e pratica com os teus flashcards e quizzes gerados por IA</p>
        </div>

        <!-- Upload Section -->
        <div class="upload-section fade-in" id="uploadSection">
            <div class="upload-box" id="uploadBox">
                <div class="upload-icon">📁</div>
                <div class="upload-text">Clica ou arrasta o ficheiro JSON aqui</div>
                <div class="upload-hint">Ficheiro gerado por generate_study_materials.py</div>
                <input type="file" id="fileInput" accept=".json">
            </div>
            <button class="btn" onclick="document.getElementById('fileInput').click()">
                Escolher Ficheiro
            </button>
        </div>

        <!-- Stats -->
        <div class="stats hidden" id="stats">
            <div class="stat-card fade-in">
                <div class="stat-number" id="flashcardsCount">0</div>
                <div class="stat-label">Flashcards</div>
            </div>
            <div class="stat-card fade-in">
                <div class="stat-number" id="quizCount">0</div>
                <div class="stat-label">Questões</div>
            </div>
            <div class="stat-card fade-in">
                <div class="stat-number" id="topicsCount">0</div>
                <div class="stat-label">Tópicos</div>
            </div>
        </div>

        <!-- Content Section -->
        <div id="contentSection" class="hidden">
            <!-- Tabs -->
            <div class="tabs">
                <button class="tab active" onclick="showTab('flashcards')">
                    📇 Flashcards
                </button>
                <button class="tab" onclick="showTab('quiz')">
                    📝 Quiz
                </button>
            </div>

            <!-- Flashcards Tab -->
            <div id="flashcardsTab" class="tab-content active">
                <div class="controls" id="flashcardControls">
                    <button class="filter-btn active" onclick="filterFlashcards('all')">
                        Todos
                    </button>
                    <button class="filter-btn" onclick="filterFlashcards('easy')">
                        Fácil
                    </button>
                    <button class="filter-btn" onclick="filterFlashcards('medium')">
                        Médio
                    </button>
                    <button class="filter-btn" onclick="filterFlashcards('hard')">
                        Difícil
                    </button>
                    <button class="filter-btn" onclick="flipAllCards()">
                        Virar Todos
                    </button>
                </div>
                <div class="flashcards-grid" id="flashcardsGrid"></div>
            </div>

            <!-- Quiz Tab -->
            <div id="quizTab" class="tab-content">
                <div id="quizContainer"></div>
            </div>
        </div>
    </div>

    <script>
        // =====================================================================
        // STATE
        // =====================================================================
        
        let studyData = null;
        let currentQuizIndex = 0;
        let quizAnswers = [];
        let currentFilter = 'all';

        // =====================================================================
        // FILE UPLOAD
        // =====================================================================
        
        const uploadBox = document.getElementById('uploadBox');
        const fileInput = document.getElementById('fileInput');

        // Click to upload
        uploadBox.addEventListener('click', () => {
            fileInput.click();
        });

        // Drag and drop
        uploadBox.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadBox.classList.add('dragover');
        });

        uploadBox.addEventListener('dragleave', () => {
            uploadBox.classList.remove('dragover');
        });

        uploadBox.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadBox.classList.remove('dragover');
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        // File input change
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            if (!file.name.endsWith('.json')) {
                alert('Por favor, escolhe um ficheiro JSON');
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    studyData = JSON.parse(e.target.result);
                    loadContent();
                } catch (error) {
                    alert('Erro ao ler ficheiro JSON: ' + error.message);
                }
            };
            reader.readAsText(file);
        }

        // =====================================================================
        // LOAD CONTENT
        // =====================================================================
        
        function loadContent() {
            // Hide upload section
            document.getElementById('uploadSection').classList.add('hidden');
            
            // Show stats
            document.getElementById('stats').classList.remove('hidden');
            
            // Update stats
            const flashcardsCount = studyData.flashcards?.flashcards?.length || 0;
            const quizCount = studyData.quiz?.questions?.length || 0;
            const topicsCount = studyData.flashcards?.metadata?.topics?.length || 0;
            
            document.getElementById('flashcardsCount').textContent = flashcardsCount;
            document.getElementById('quizCount').textContent = quizCount;
            document.getElementById('topicsCount').textContent = topicsCount;
            
            // Show content
            document.getElementById('contentSection').classList.remove('hidden');
            
            // Load flashcards
            if (flashcardsCount > 0) {
                loadFlashcards();
            }
            
            // Load quiz
            if (quizCount > 0) {
                loadQuiz();
            }
        }

        // =====================================================================
        // FLASHCARDS
        // =====================================================================
        
        function loadFlashcards() {
            const grid = document.getElementById('flashcardsGrid');
            grid.innerHTML = '';
            
            const flashcards = studyData.flashcards.flashcards;
            
            flashcards.forEach((card, index) => {
                const cardElement = createFlashcard(card, index);
                grid.appendChild(cardElement);
            });
        }

        function createFlashcard(card, index) {
            const container = document.createElement('div');
            container.className = 'flashcard-container fade-in';
            container.dataset.difficulty = card.difficulty;
            
            container.innerHTML = `
                <div class="flashcard" onclick="flipCard(this)">
                    <div class="flashcard-front">
                        <span class="difficulty-badge difficulty-${card.difficulty}">
                            ${card.difficulty}
                        </span>
                        <h3>${card.front}</h3>
                        <div class="tags">
                            ${card.tags ? card.tags.map(tag => 
                                `<span class="tag">${tag}</span>`
                            ).join('') : ''}
                        </div>
                        <span class="flip-hint">Clica para virar</span>
                    </div>
                    <div class="flashcard-back">
                        <span class="difficulty-badge difficulty-${card.difficulty}">
                            ${card.difficulty}
                        </span>
                        <p>${card.back}</p>
                        <div class="tags">
                            ${card.tags ? card.tags.map(tag => 
                                `<span class="tag">${tag}</span>`
                            ).join('') : ''}
                        </div>
                        <span class="flip-hint">Clica para virar</span>
                    </div>
                </div>
            `;
            
            return container;
        }

        function flipCard(card) {
            card.classList.toggle('flipped');
        }

        function flipAllCards() {
            const cards = document.querySelectorAll('.flashcard');
            const anyFlipped = Array.from(cards).some(card => card.classList.contains('flipped'));
            
            cards.forEach(card => {
                if (anyFlipped) {
                    card.classList.remove('flipped');
                } else {
                    card.classList.add('flipped');
                }
            });
        }

        function filterFlashcards(difficulty) {
            currentFilter = difficulty;
            
            // Update button states
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // Filter cards
            const containers = document.querySelectorAll('.flashcard-container');
            
            containers.forEach(container => {
                if (difficulty === 'all' || container.dataset.difficulty === difficulty) {
                    container.style.display = 'block';
                } else {
                    container.style.display = 'none';
                }
            });
        }

        // =====================================================================
        // QUIZ
        // =====================================================================
        
        function loadQuiz() {
            currentQuizIndex = 0;
            quizAnswers = [];
            showQuizQuestion();
        }

        function showQuizQuestion() {
            const container = document.getElementById('quizContainer');
            const questions = studyData.quiz.questions;
            
            if (currentQuizIndex >= questions.length) {
                showQuizResults();
                return;
            }
            
            const question = questions[currentQuizIndex];
            const isAnswered = quizAnswers[currentQuizIndex] !== undefined;
            
            container.innerHTML = `
                <div class="quiz-container fade-in">
                    <div class="question-header">
                        <span class="question-number">
                            Questão ${currentQuizIndex + 1} de ${questions.length}
                        </span>
                        <span class="question-difficulty difficulty-badge difficulty-${question.difficulty}">
                            ${question.difficulty}
                        </span>
                    </div>
                    
                    <div class="question-text">${question.question}</div>
                    
                    <div class="options">
                        ${question.options.map((option, i) => {
                            let optionClass = 'option';
                            if (isAnswered) {
                                if (i === question.correct_answer_index) {
                                    optionClass += ' correct';
                                } else if (quizAnswers[currentQuizIndex] === i) {
                                    optionClass += ' wrong';
                                }
                            } else if (quizAnswers[currentQuizIndex] === i) {
                                optionClass += ' selected';
                            }
                            
                            return `
                                <div class="${optionClass}" onclick="selectOption(${i})">
                                    <div class="option-letter">${String.fromCharCode(65 + i)}</div>
                                    <div class="option-text">${option}</div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                    
                    <div class="explanation ${isAnswered ? 'show' : ''}">
                        <div class="explanation-title">💡 Explicação:</div>
                        <div class="explanation-text">${question.explanation}</div>
                        ${question.concept ? `
                            <div style="margin-top: 15px; color: #667eea; font-weight: 600;">
                                📚 Conceito: ${question.concept}
                            </div>
                        ` : ''}
                    </div>
                    
                    <div class="quiz-nav">
                        <button class="btn" onclick="previousQuestion()" 
                                ${currentQuizIndex === 0 ? 'disabled' : ''}>
                            ← Anterior
                        </button>
                        
                        ${isAnswered ? `
                            <button class="btn" onclick="nextQuestion()">
                                ${currentQuizIndex < questions.length - 1 ? 'Próxima →' : 'Ver Resultados 🎉'}
                            </button>
                        ` : `
                            <button class="btn" onclick="checkAnswer()" 
                                    ${quizAnswers[currentQuizIndex] === undefined ? 'disabled' : ''}>
                                Verificar Resposta
                            </button>
                        `}
                    </div>
                    
                    <div class="quiz-progress">
                        Progresso: ${quizAnswers.filter(a => a !== undefined).length} / ${questions.length}
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${(quizAnswers.filter(a => a !== undefined).length / questions.length) * 100}%"></div>
                        </div>
                    </div>
                </div>
            `;
        }

        function selectOption(optionIndex) {
            // Só permite selecionar se ainda não respondeu
            if (quizAnswers[currentQuizIndex] === undefined) {
                quizAnswers[currentQuizIndex] = optionIndex;
                showQuizQuestion();
            }
        }

        function checkAnswer() {
            // Marca como respondida (já tem valor em quizAnswers)
            showQuizQuestion();
        }

        function previousQuestion() {
            if (currentQuizIndex > 0) {
                currentQuizIndex--;
                showQuizQuestion();
            }
        }

        function nextQuestion() {
            currentQuizIndex++;
            showQuizQuestion();
        }

        function showQuizResults() {
            const container = document.getElementById('quizContainer');
            const questions = studyData.quiz.questions;
            
            const correctAnswers = quizAnswers.filter((answer, i) => 
                answer === questions[i].correct_answer_index
            ).length;
            
            const score = Math.round((correctAnswers / questions.length) * 100);
            
            let message = '';
            let emoji = '';
            
            if (score >= 90) {
                message = 'Excelente! 🌟';
                emoji = '🎉';
            } else if (score >= 70) {
                message = 'Muito Bom! 👏';
                emoji = '😊';
            } else if (score >= 50) {
                message = 'Bom trabalho! 👍';
                emoji = '🙂';
            } else {
                message = 'Continua a estudar! 💪';
                emoji = '📚';
            }
            
            container.innerHTML = `
                <div class="results fade-in">
                    <h2>${emoji} ${message}</h2>
                    
                    <div class="score-circle">
                        <div class="score-number">${score}%</div>
                    </div>
                    
                    <div class="stats">
                        <div class="stat-card">
                            <div class="stat-number">${correctAnswers}</div>
                            <div class="stat-label">Corretas</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${questions.length - correctAnswers}</div>
                            <div class="stat-label">Erradas</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${questions.length}</div>
                            <div class="stat-label">Total</div>
                        </div>
                    </div>
                    
                    <button class="btn" onclick="loadQuiz()">
                        Tentar Novamente
                    </button>
                    <button class="btn" onclick="showTab('flashcards')">
                        Ver Flashcards
                    </button>
                </div>
            `;
        }

        // =====================================================================
        // TABS
        // =====================================================================
        
        function showTab(tabName) {
            // Update tab buttons
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // Update tab content
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            
            if (tabName === 'flashcards') {
                document.getElementById('flashcardsTab').classList.add('active');
            } else if (tabName === 'quiz') {
                document.getElementById('quizTab').classList.add('active');
                // Reset quiz if needed
                if (currentQuizIndex === 0 && quizAnswers.length === 0) {
                    loadQuiz();
                }
            }
        }

    </script>
</body>
</html>
